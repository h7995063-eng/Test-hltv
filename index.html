<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HLTV MiniApp</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0b0e14;
    --sidebar: #11141c;
    --card: #1c1f26;
    --card-hover: #262a33;
    --accent: #d4af37;
    --text: #ffffff;
    --muted: #7a8290;
    --border: #2a2e38;
    --red: #f43f5e;
    --win: #10b981;
    --lose: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden;
  }

  /* ===== БОКОВАЯ ПАНЕЛЬ ===== */
  .sidebar {
    width: 240px; background: var(--sidebar); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 20px 12px; transition: transform 0.3s ease; z-index: 100;
  }
  .logo { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; padding: 0 12px 24px 12px; letter-spacing: 1px; }
  .logo svg { width: 24px; height: 24px; fill: var(--text); }
  .nav-item {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 10px;
    color: var(--muted); font-size: 14px; font-weight: 500; cursor: pointer; margin-bottom: 4px; transition: all 0.2s;
  }
  .nav-item:hover { color: var(--text); background: rgba(255,255,255,0.05); }
  .nav-item.active { color: #fff; background: rgba(212, 175, 55, 0.1); border: 1px solid rgba(212, 175, 55, 0.3); }
  .nav-item svg { width: 20px; height: 20px; fill: currentColor; }
  .sidebar-footer { margin-top: auto; padding-top: 20px; }
  .support { display: flex; align-items: center; gap: 10px; padding: 12px 16px; color: var(--muted); font-size: 14px; cursor: pointer; border: 1px solid var(--border); border-radius: 10px; background: transparent; width: 100%; }
  .support svg { width: 18px; height: 18px; fill: currentColor; }

  /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
  .main { flex: 1; overflow-y: auto; padding: 20px; position: relative; }
  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .menu-btn { display: none; background: transparent; border: none; color: var(--text); cursor: pointer; padding: 8px; }
  .menu-btn svg { width: 24px; height: 24px; fill: currentColor; }

  /* ===== КАРТОЧКА МАТЧА ===== */
  .match-card {
    background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
    border-radius: 16px; padding: 24px; margin-bottom: 24px;
    border: 1px solid #312e81;
    position: relative; overflow: hidden;
  }
  /* Имитация фона карты (потом можно заменить на реальную картинку) */
  .match-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1000&auto=format&fit=crop') center/cover;
    opacity: 0.15; z-index: 0;
  }
  .match-content { position: relative; z-index: 1; }
  
  .match-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .match-tournament { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .match-map { font-size: 20px; font-weight: 700; }
  
  .match-score-box {
    display: flex; align-items: center; gap: 16px; margin-bottom: 20px;
    background: rgba(0,0,0,0.4); padding: 16px; border-radius: 12px;
    backdrop-filter: blur(10px);
  }
  .team-block { flex: 1; display: flex; align-items: center; gap: 12px; }
  .team-block.right { flex-direction: row-reverse; text-align: right; }
  .team-logo { width: 40px; height: 40px; background: #333; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; }
  .team-name-match { font-size: 18px; font-weight: 700; }
  
  .score {
    font-size: 28px; font-weight: 800; color: var(--text);
    background: rgba(255,255,255,0.1); padding: 4px 16px; border-radius: 8px;
  }
  .score.win { color: var(--win); background: rgba(16, 185, 129, 0.1); }
  .score.lose { color: var(--lose); background: rgba(239, 68, 68, 0.1); }

  /* ===== ТАБЛИЦА ИГРОКОВ ===== */
  .players-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .players-table th { text-align: left; color: var(--muted); font-weight: 500; padding: 10px 8px; border-bottom: 1px solid var(--border); }
  .players-table td { padding: 12px 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .players-table tr:last-child td { border-bottom: none; }
  
  .player-cell { display: flex; align-items: center; gap: 10px; }
  .player-avatar { width: 28px; height: 28px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }
  .player-nick { font-weight: 600; }
  .player-stats { color: var(--muted); font-size: 12px; }
  
  .stat-val { font-weight: 600; }
  .stat-kd { color: var(--accent); }

  /* ===== АДАПТИВ ===== */
  @media (max-width: 768px) {
    .sidebar { position: absolute; height: 100%; transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .menu-btn { display: block; }
    .overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 90; display: none; }
    .overlay.open { display: block; }
    
    /* На мобилке таблицу делаем скроллируемой */
    .table-wrapper { overflow-x: auto; margin: 0 -20px; padding: 0 20px; }
    .players-table { min-width: 500px; }
    
    .match-score-box { flex-direction: column; gap: 10px; text-align: center; }
    .team-block { flex-direction: column; gap: 6px; }
    .team-block.right { flex-direction: column; }
  }

  /* Экран команды */
  .hidden { display: none !important; }
  .team-detail { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
  .team-detail h2 { font-size: 22px; margin-bottom: 16px; }
  .stats { display: flex; gap: 12px; margin-bottom: 20px; }
  .stat { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px; text-align: center; }
  .stat .val { font-size: 18px; font-weight: 700; }
  .stat .lbl { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .player { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .player:last-child { border-bottom: none; }
  .player .slot { width: 28px; height: 28px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); }
  .player .nick { font-size: 16px; }
  .back-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 10px 16px; border-radius: 10px; font-size: 14px; margin-bottom: 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .back-btn svg { width: 16px; height: 16px; fill: currentColor; }
</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<!-- БОКОВАЯ ПАНЕЛЬ -->
<div class="sidebar" id="sidebar">
  <div class="logo">
    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    HLTV MINI
  </div>
  <div class="nav-item" data-tab="ranking" onclick="switchTab('ranking')">
    <svg viewBox="0 0 24 24"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm0 2v14h14V5H5zm2 4h10v2H7V9zm0 4h10v2H7v-2z"/></svg>
    Рейтинг
  </div>
  <div class="nav-item active" data-tab="matches" onclick="switchTab('matches')">
    <svg viewBox="0 0 24 24"><path d="M7 2h10a2 2 0 0 1 2 2v2h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2V4a2 2 0 0 1 2-2zm0 2v2h10V4H7zm-4 6v10h18V10H3zm4 3h4v2H7v-2zm6 0h4v2h-4v-2z"/></svg>
    Матчи
  </div>
  <div class="nav-item" data-tab="tournaments" onclick="switchTab('tournaments')">
    <svg viewBox="0 0 24 24"><path d="M18 2H6v2H2v4a4 4 0 0 0 4 4h.35A6 6 0 0 0 11 15.9V18H8v2h8v-2h-3v-2.1a6 6 0 0 0 4.65-3.9H18a4 4 0 0 0 4-4V4h-4V2zM6 10a2 2 0 0 1-2-2V6h2v4zm14-2a2 2 0 0 1-2 2V6h2v2z"/></svg>
    Турниры
  </div>
  <div class="sidebar-footer">
    <button class="support"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg>Поддержка</button>
  </div>
</div>

<!-- ОСНОВНОЙ КОНТЕНТ -->
<div class="main">
  <div class="top-bar">
    <button class="menu-btn" onclick="toggleMenu()"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
  </div>
  <div id="content-area"></div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const DATA = {
    teams: [
      { name:"FURIA", points:960, wins:12, losses:4, players:["FalleN","yuurih","KSCERATO","molodoy","YEKINDAR"] },
      { name:"MOUZ", points:808, wins:10, losses:5, players:["torzsi","xertioN","Jimpphat","Brollan","Spinx"] },
    ],
    matches: [
      {
        id: 1,
        map: "de_mirage",
        tournament: "IEM Katowice 2024",
        team1: { name: "FURIA", score: 13, players: [
          { nick: "FalleN", kills: 24, deaths: 16, hs: 74 },
          { nick: "yuurih", kills: 21, deaths: 18, hs: 65 },
          { nick: "KSCERATO", kills: 19, deaths: 17, hs: 60 },
          { nick: "molodoy", kills: 15, deaths: 20, hs: 55 },
          { nick: "YEKINDAR", kills: 12, deaths: 21, hs: 48 },
        ]},
        team2: { name: "MOUZ", score: 9, players: [
          { nick: "torzsi", kills: 22, deaths: 17, hs: 70 },
          { nick: "xertioN", kills: 20, deaths: 18, hs: 62 },
          { nick: "Jimpphat", kills: 18, deaths: 19, hs: 58 },
          { nick: "Brollan", kills: 16, deaths: 18, hs: 52 },
          { nick: "Spinx", kills: 14, deaths: 19, hs: 45 },
        ]}
      }
    ],
    tournaments: []
  };

  let currentTab = "matches";

  function toggleMenu() {
    document.getElementById("sidebar").classList.toggle("open");
    document.getElementById("overlay").classList.toggle("open");
  }

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll(".nav-item").forEach(el => el.classList.remove("active"));
    document.querySelector(`.nav-item[data-tab="${tab}"]`)?.classList.add("active");
    if (window.innerWidth <= 768) toggleMenu();
    render();
  }

  function render() {
    const content = document.getElementById("content-area");
    
    if (currentTab === "ranking") {
      let html = `<h1>Рейтинг команд</h1>`;
      DATA.teams.sort((a,b)=>b.points-a.points).forEach((t,i)=>{
        html += `
          <div class="card" style="background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;">
            <div style="font-size:18px;font-weight:600;color:var(--muted);width:30px;text-align:center;">${i+1}</div>
            <div style="width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#a855f7,#ec4899);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;margin-right:14px;">${t.name.charAt(0)}</div>
            <div style="flex:1;"><div style="font-size:16px;font-weight:600;">${t.name}</div><div style="font-size:12px;color:var(--muted);margin-top:2px;">${t.wins + t.losses} матчей</div></div>
            <div style="font-size:12px;color:var(--accent);border:1px solid rgba(212,175,55,0.3);padding:6px 12px;border-radius:20px;font-weight:500;">${t.points} PTS</div>
          </div>
        `;
      });
      content.innerHTML = html;
    } 
    else if (currentTab === "matches") {
      let html = `<h1>Сыгранные матчи</h1>`;
      
      DATA.matches.forEach(m => {
        const winner = m.team1.score > m.team2.score ? m.team1 : m.team2;
        
        html += `
          <div class="match-card">
            <div class="match-content">
              <div class="match-header">
                <div>
                  <div class="match-tournament">${m.tournament}</div>
                  <div class="match-map">${m.map} · Завершен</div>
                </div>
                <div style="background:rgba(255,255,255,0.1);padding:6px 12px;border-radius:8px;font-size:12px;">Победа: <b style="color:var(--win)">${winner.name}</b></div>
              </div>

              <div class="match-score-box">
                <div class="team-block">
                  <div class="team-logo">${m.team1.name.charAt(0)}</div>
                  <div class="team-name-match">${m.team1.name}</div>
                </div>
                <div class="score ${m.team1.score > m.team2.score ? 'win':'lose'}">${m.team1.score}</div>
                <div class="score ${m.team2.score > m.team1.score ? 'win':'lose'}">${m.team2.score}</div>
                <div class="team-block right">
                  <div class="team-logo">${m.team2.name.charAt(0)}</div>
                  <div class="team-name-match">${m.team2.name}</div>
                </div>
              </div>

              <div class="table-wrapper">
                <table class="players-table">
                  <thead>
                    <tr>
                      <th>Игрок</th>
                      <th>Убийства</th>
                      <th>К/Д</th>
                      <th>HS%</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${[...m.team1.players, ...m.team2.players].map(p => {
                      const kd = (p.kills / p.deaths).toFixed(2);
                      return `
                        <tr>
                          <td>
                            <div class="player-cell">
                              <div class="player-avatar">${p.nick.charAt(0)}</div>
                              <div>
                                <div class="player-nick">${p.nick}</div>
                                <div class="player-stats">${p.nick === m.team1.players.find(t=>t.nick===p.nick)?.nick ? m.team1.name : m.team2.name}</div>
                              </div>
                            </div>
                          </td>
                          <td class="stat-val">${p.kills}</td>
                          <td class="stat-val stat-kd">${kd}</td>
                          <td class="stat-val">${p.hs}%</td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;
      });
      content.innerHTML = html || `<div class="empty">Матчей пока нет</div>`;
    } 
    else if (currentTab === "tournaments") {
      content.innerHTML = `<h1>Турниры</h1><div class="empty">Турниров пока нет.</div>`;
    }
  }

  // Инициализация
  render();
</script>
</body>
</html>
