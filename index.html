<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HLTV MiniApp</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0b0e14;
    --sidebar: #11141c;
    --card: #1c1f26;
    --card-hover: #262a33;
    --accent: #d4af37;
    --text: #ffffff;
    --muted: #7a8290;
    --border: #2a2e38;
    --red: #f43f5e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ===== БОКОВАЯ ПАНЕЛЬ ===== */
  .sidebar {
    width: 240px;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px 12px;
    transition: transform 0.3s ease;
    z-index: 100;
  }
  
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 700;
    padding: 0 12px 24px 12px;
    letter-spacing: 1px;
  }
  .logo svg { width: 24px; height: 24px; fill: var(--text); }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-radius: 10px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    margin-bottom: 4px;
    transition: all 0.2s;
  }
  .nav-item:hover { color: var(--text); background: rgba(255,255,255,0.05); }
  .nav-item.active {
    color: #fff;
    background: rgba(212, 175, 55, 0.1);
    border: 1px solid rgba(212, 175, 55, 0.3);
  }
  .nav-item svg { width: 20px; height: 20px; fill: currentColor; }

  .sidebar-footer {
    margin-top: auto;
    padding-top: 20px;
  }
  .support {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: transparent;
    width: 100%;
  }
  .support svg { width: 18px; height: 18px; fill: currentColor; }

  /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
  .main {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    position: relative;
  }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .menu-btn {
    display: none; /* Скрыта на широких экранах */
    background: transparent;
    border: none;
    color: var(--text);
    cursor: pointer;
    padding: 8px;
  }
  .menu-btn svg { width: 24px; height: 24px; fill: currentColor; }

  .create-btn {
    background: var(--red);
    color: #fff;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
  }
  .create-btn svg { width: 16px; height: 16px; fill: currentColor; }

  h1 { font-size: 24px; margin-bottom: 20px; }

  /* ===== КАРТОЧКИ КОМАНД ===== */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    cursor: pointer;
    transition: background 0.2s;
  }
  .card:active { background: var(--card-hover); }
  
  .rank { font-size: 18px; font-weight: 600; color: var(--muted); width: 30px; text-align: center; }
  .avatar {
    width: 44px; height: 44px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; color: #fff;
    margin-right: 14px; flex-shrink: 0;
    background: linear-gradient(135deg, #a855f7, #ec4899);
  }
  .avatar.c1 { background: linear-gradient(135deg, #a855f7, #ec4899); }
  .avatar.c2 { background: linear-gradient(135deg, #3b82f6, #8b5cf6); }
  .avatar.c3 { background: linear-gradient(135deg, #10b981, #3b82f6); }
  .avatar.c4 { background: linear-gradient(135deg, #f59e0b, #ef4444); }
  .avatar.c5 { background: linear-gradient(135deg, #6366f1, #a855f7); }

  .info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .info .name { font-size: 16px; font-weight: 600; }
  .info .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .points {
    font-size: 12px; color: var(--accent);
    border: 1px solid rgba(212, 175, 55, 0.3);
    padding: 6px 12px; border-radius: 20px;
    font-weight: 500; white-space: nowrap;
  }

  /* ===== ЭКРАН КОМАНДЫ ===== */
  .hidden { display: none !important; }
  .team-detail { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
  .team-detail h2 { font-size: 22px; margin-bottom: 16px; }
  
  .stats { display: flex; gap: 12px; margin-bottom: 20px; }
  .stat { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px; text-align: center; }
  .stat .val { font-size: 18px; font-weight: 700; }
  .stat .lbl { font-size: 11px; color: var(--muted); margin-top: 4px; }

  .player { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .player:last-child { border-bottom: none; }
  .player .slot {
    width: 28px; height: 28px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: var(--muted);
  }
  .player .nick { font-size: 16px; }

  .back-btn {
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); padding: 10px 16px; border-radius: 10px;
    font-size: 14px; margin-bottom: 16px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .back-btn svg { width: 16px; height: 16px; fill: currentColor; }

  /* ===== АДАПТИВ ===== */
  @media (max-width: 768px) {
    .sidebar {
      position: absolute;
      height: 100%;
      transform: translateX(-100%);
    }
    .sidebar.open { transform: translateX(0); }
    .menu-btn { display: block; }
    
    /* Затемнение фона при открытом меню */
    .overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); z-index: 90;
      display: none;
    }
    .overlay.open { display: block; }
  }
</style>
</head>
<body>

<!-- Затемнение для мобилки -->
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<!-- БОКОВАЯ ПАНЕЛЬ -->
<div class="sidebar" id="sidebar">
  <div class="logo">
    <!-- Иконка логотипа (шестигранник) -->
    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    CYBERSHOKE
  </div>

  <div class="nav-item active" data-tab="ranking" onclick="switchTab('ranking')">
    <svg viewBox="0 0 24 24"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm0 2v14h14V5H5zm2 4h10v2H7V9zm0 4h10v2H7v-2z"/></svg>
    Рейтинг
  </div>
  <div class="nav-item" data-tab="matches" onclick="switchTab('matches')">
    <svg viewBox="0 0 24 24"><path d="M7 2h10a2 2 0 0 1 2 2v2h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2V4a2 2 0 0 1 2-2zm0 2v2h10V4H7zm-4 6v10h18V10H3zm4 3h4v2H7v-2zm6 0h4v2h-4v-2z"/></svg>
    Матчи
  </div>
  <div class="nav-item" data-tab="tournaments" onclick="switchTab('tournaments')">
    <svg viewBox="0 0 24 24"><path d="M18 2H6v2H2v4a4 4 0 0 0 4 4h.35A6 6 0 0 0 11 15.9V18H8v2h8v-2h-3v-2.1a6 6 0 0 0 4.65-3.9H18a4 4 0 0 0 4-4V4h-4V2zM6 10a2 2 0 0 1-2-2V6h2v4zm14-2a2 2 0 0 1-2 2V6h2v2z"/></svg>
    Турниры
  </div>
  <!-- Можно добавить Профиль и Админку позже -->
  <div class="nav-item">
    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
    Профиль
  </div>

  <div class="sidebar-footer">
    <button class="support">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg>
      Поддержка
    </button>
  </div>
</div>

<!-- ОСНОВНОЙ КОНТЕНТ -->
<div class="main">
  <div class="top-bar">
    <button class="menu-btn" onclick="toggleMenu()">
      <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
    </button>
    <!-- Кнопка "Создать лобби" (можно убрать, если не нужна) -->
    <button class="create-btn" style="margin-left:auto;">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      Создать
    </button>
  </div>

  <div id="content-area">
    <!-- Сюда рендерится контент -->
  </div>

  <!-- Экран команды -->
  <div id="team-screen" class="hidden">
    <button class="back-btn" onclick="showMain()">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      Назад
    </button>
    <div id="team-content"></div>
  </div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const DATA = {
    teams: [
      { name:"Ninao", points:0, wins:0, losses:0, players:["Player1","Player2","Player3","Player4","Player5"] },
      { name:"werf1", points:0, wins:0, losses:0, players:["Player1","Player2","Player3","Player4","Player5"] },
      { name:"storm", points:0, wins:0, losses:0, players:["Player1","Player2","Player3","Player4","Player5"] },
      { name:"FURIA", points:960, wins:12, losses:4, players:["FalleN","yuurih","KSCERATO","molodoy","YEKINDAR"] },
      { name:"MOUZ", points:808, wins:10, losses:5, players:["torzsi","xertioN","Jimpphat","Brollan","Spinx"] },
    ],
    matches: [],
    tournaments: []
  };

  let currentTab = "ranking";

  function toggleMenu() {
    document.getElementById("sidebar").classList.toggle("open");
    document.getElementById("overlay").classList.toggle("open");
  }

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll(".nav-item").forEach(el => el.classList.remove("active"));
    document.querySelector(`.nav-item[data-tab="${tab}"]`)?.classList.add("active");
    
    // На мобилке закрываем меню после выбора
    if (window.innerWidth <= 768) toggleMenu();

    showMain();
    render();
  }

  function render() {
    const content = document.getElementById("content-area");
    const teamScreen = document.getElementById("team-screen");
    teamScreen.classList.add("hidden");
    content.classList.remove("hidden");

    if (currentTab === "ranking") {
      let html = `<h1>Рейтинг команд</h1>`;
      DATA.teams.sort((a,b)=>b.points-a.points).forEach((t,i)=>{
        const letter = t.name.charAt(0).toUpperCase();
        const colorClass = `c${(i % 5) + 1}`;
        
        html += `
          <div class="card" onclick="showTeam('${t.name}')">
            <div class="rank">${i+1}</div>
            <div class="avatar ${colorClass}">${letter}</div>
            <div class="info">
              <div class="name">${t.name}</div>
              <div class="sub">${t.wins + t.losses} матчей</div>
            </div>
            <div class="points">${t.points} Поинтов</div>
          </div>
        `;
      });
      content.innerHTML = html;
    } 
    else if (currentTab === "matches") {
      content.innerHTML = `<h1>Матчи</h1><div class="empty">Матчей пока нет. Создайте первый!</div>`;
    } 
    else if (currentTab === "tournaments") {
      content.innerHTML = `<h1>Турниры</h1><div class="empty">Турниров пока нет.</div>`;
    }
  }

  function showTeam(name) {
    const team = DATA.teams.find(t=>t.name===name);
    if (!team) return;
    document.getElementById("content-area").classList.add("hidden");
    document.getElementById("team-screen").classList.remove("hidden");
    
    const playersHtml = team.players.map((p,i)=>`
      <div class="player">
        <span class="slot">${i+1}</span>
        <span class="nick">${p}</span>
      </div>
    `).join("");

    document.getElementById("team-content").innerHTML = `
      <div class="team-detail">
        <h2>${team.name}</h2>
        <div class="stats">
          <div class="stat"><div class="val">${team.points}</div><div class="lbl">Поинты</div></div>
          <div class="stat"><div class="val" style="color:#00ba7c">${team.wins}</div><div class="lbl">Победы</div></div>
          <div class="stat"><div class="val" style="color:#f4212e">${team.losses}</div><div class="lbl">Поражения</div></div>
        </div>
        <h3 style="font-size:14px;color:var(--muted);margin-bottom:8px;">СОСТАВ</h3>
        ${playersHtml}
      </div>
    `;
  }

  function showMain() {
    document.getElementById("content-area").classList.remove("hidden");
    document.getElementById("team-screen").classList.add("hidden");
  }

  // Инициализация
  render();
</script>
</body>
</html>
