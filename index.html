<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HLTV MiniApp</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0b0e14;
    --card: #1c1f26;
    --card-hover: #262a33;
    --accent: #d4af37;
    --text: #ffffff;
    --muted: #7a8290;
    --border: #2a2e38;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
    padding-bottom: 40px;
  }
  h1 {
    font-size: 20px;
    margin-bottom: 16px;
    color: var(--text);
    font-weight: 600;
  }

  /* КНОПКИ РАЗДЕЛОВ (сверху слева) */
  .tabs {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 20px;
  }
  .tab {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 140px;
  }
  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
    font-weight: 600;
  }
  .tab svg { width: 16px; height: 16px; fill: currentColor; }

  /* КАРТОЧКА КОМАНДЫ (как на скрине) */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 12px 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    cursor: pointer;
    transition: background 0.2s;
    text-decoration: none;
    color: var(--text);
  }
  .card:active { background: var(--card-hover); }
  
  /* Место (цифра) */
  .rank {
    font-size: 18px;
    font-weight: 600;
    color: var(--muted);
    width: 30px;
    text-align: center;
  }

  /* Аватарка */
  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    margin-right: 14px;
    flex-shrink: 0;
    /* Градиент по умолчанию */
    background: linear-gradient(135deg, #a855f7, #ec4899);
  }
  /* Разные градиенты для разнообразия */
  .avatar.c1 { background: linear-gradient(135deg, #a855f7, #ec4899); }
  .avatar.c2 { background: linear-gradient(135deg, #3b82f6, #8b5cf6); }
  .avatar.c3 { background: linear-gradient(135deg, #10b981, #3b82f6); }
  .avatar.c4 { background: linear-gradient(135deg, #f59e0b, #ef4444); }
  .avatar.c5 { background: linear-gradient(135deg, #6366f1, #a855f7); }

  /* Информация о команде */
  .info {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .info .name {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
  }
  .info .sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* Плашка с поинтами */
  .points {
    font-size: 12px;
    color: var(--accent);
    border: 1px solid rgba(212, 175, 55, 0.3);
    padding: 6px 12px;
    border-radius: 20px;
    font-weight: 500;
    white-space: nowrap;
  }

  /* Экран команды */
  .hidden { display: none; }
  .team-detail {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
  }
  .team-detail h2 {
    font-size: 20px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .team-detail h2 svg { width: 22px; height: 22px; fill: var(--accent); }

  .stats { display: flex; gap: 12px; margin-bottom: 16px; }
  .stat {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    text-align: center;
  }
  .stat .val { font-size: 18px; font-weight: 700; color: var(--text); }
  .stat .lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .player {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .player:last-child { border-bottom: none; }
  .player .slot {
    width: 24px;
    height: 24px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: var(--muted);
  }
  .player .nick { font-size: 15px; }

  .back-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 14px;
    margin-bottom: 16px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .back-btn svg { width: 16px; height: 16px; fill: currentColor; }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; }
</style>
</head>
<body>

<div id="main-screen">
  <h1>Рейтинг команд</h1>

  <!-- КНОПКИ РАЗДЕЛОВ СВЕРХУ СЛЕВА -->
  <div class="tabs">
    <button class="tab active" data-tab="ranking">
      <svg viewBox="0 0 24 24"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm0 2v14h14V5H5zm2 4h10v2H7V9zm0 4h10v2H7v-2z"/></svg>
      Рейтинг
    </button>
    <button class="tab" data-tab="matches">
      <svg viewBox="0 0 24 24"><path d="M7 2h10a2 2 0 0 1 2 2v2h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2V4a2 2 0 0 1 2-2zm0 2v2h10V4H7zm-4 6v10h18V10H3zm4 3h4v2H7v-2zm6 0h4v2h-4v-2z"/></svg>
      Матчи
    </button>
    <button class="tab" data-tab="tournaments">
      <svg viewBox="0 0 24 24"><path d="M18 2H6v2H2v4a4 4 0 0 0 4 4h.35A6 6 0 0 0 11 15.9V18H8v2h8v-2h-3v-2.1a6 6 0 0 0 4.65-3.9H18a4 4 0 0 0 4-4V4h-4V2zM6 10a2 2 0 0 1-2-2V6h2v4zm14-2a2 2 0 0 1-2 2V6h2v2z"/></svg>
      Турниры
    </button>
  </div>

  <div id="content"></div>
</div>

<div id="team-screen" class="hidden">
  <button class="back-btn" onclick="showMain()">
    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    Назад
  </button>
  <div id="team-content"></div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  // Данные с картинками (или просто буквами для аватарок)
  const DATA = {
    teams: [
      { name:"Ninao", points:0, wins:0, losses:0, players:["Player1","Player2","Player3","Player4","Player5"] },
      { name:"werf1", points:0, wins:0, losses:0, players:["Player1","Player2","Player3","Player4","Player5"] },
      { name:"storm", points:0, wins:0, losses:0, players:["Player1","Player2","Player3","Player4","Player5"] },
      { name:"FURIA", points:960, wins:12, losses:4, players:["FalleN","yuurih","KSCERATO","molodoy","YEKINDAR"] },
      { name:"MOUZ", points:808, wins:10, losses:5, players:["torzsi","xertioN","Jimpphat","Brollan","Spinx"] },
    ],
    matches: [
      { team1:"FURIA", team2:"MOUZ", score1:2, score2:1, tournament:"IEM Katowice" },
    ],
    tournaments: [
      { name:"IEM Katowice", prize:"$1,000,000" },
    ]
  };

  let currentTab = "ranking";

  function render() {
    const content = document.getElementById("content");
    
    if (currentTab === "ranking") {
      let html = "";
      // Сортируем по поинтам
      DATA.teams.sort((a,b)=>b.points-a.points).forEach((t,i)=>{
        // Берем первую букву для аватарки
        const letter = t.name.charAt(0).toUpperCase();
        // Класс цвета (просто чередуем 1-5)
        const colorClass = `c${(i % 5) + 1}`;
        
        html += `
          <div class="card" onclick="showTeam('${t.name}')">
            <div class="rank">${i+1}</div>
            <div class="avatar ${colorClass}">${letter}</div>
            <div class="info">
              <div class="name">${t.name}</div>
              <div class="sub">${t.wins + t.losses} матчей</div>
            </div>
            <div class="points">${t.points} Поинтов</div>
          </div>
        `;
      });
      content.innerHTML = html;
    } 
    else if (currentTab === "matches") {
      let html = "";
      DATA.matches.forEach(m=>{
        html += `<div class="card"><span style="font-weight:600">${m.team1}</span> <span style="color:var(--accent);margin:0 10px">${m.score1}:${m.score2}</span> <span style="font-weight:600">${m.team2}</span></div>`;
      });
      content.innerHTML = html || '<div class="empty">Матчей пока нет</div>';
    } 
    else if (currentTab === "tournaments") {
      let html = "";
      DATA.tournaments.forEach(t=>{
        html += `<div class="card"><span style="font-weight:600">${t.name}</span> <span class="points">${t.prize}</span></div>`;
      });
      content.innerHTML = html || '<div class="empty">Турниров пока нет</div>';
    }
  }

  function showTeam(name) {
    const team = DATA.teams.find(t=>t.name===name);
    if (!team) return;
    document.getElementById("main-screen").classList.add("hidden");
    document.getElementById("team-screen").classList.remove("hidden");
    
    // Формируем состав
    const playersHtml = team.players.map((p,i)=>`
      <div class="player">
        <span class="slot">${i+1}</span>
        <span class="nick">${p}</span>
      </div>
    `).join("");

    document.getElementById("team-content").innerHTML = `
      <div class="team-detail">
        <h2>${team.name}</h2>
        <div class="stats">
          <div class="stat"><div class="val">${team.points}</div><div class="lbl">Поинты</div></div>
          <div class="stat"><div class="val" style="color:#00ba7c">${team.wins}</div><div class="lbl">Победы</div></div>
          <div class="stat"><div class="val" style="color:#f4212e">${team.losses}</div><div class="lbl">Поражения</div></div>
        </div>
        <h3 style="font-size:14px;color:var(--muted);margin-bottom:8px;">СОСТАВ</h3>
        ${playersHtml}
      </div>
    `;
  }

  function showMain() {
    document.getElementById("team-screen").classList.add("hidden");
    document.getElementById("main-screen").classList.remove("hidden");
  }

  // Переключение вкладок
  document.querySelectorAll(".tab").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      currentTab = btn.dataset.tab;
      render();
    });
  });

  render();
</script>
</body>
</html>
