<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HLTV MiniApp</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style_v4.css?v=4">
</head>
<body>

  <!-- Элементы для меню (чтобы скрипт не падал) -->
  <div id="overlay" class="overlay" onclick="toggleMenu()"></div>


<div id="splash-screen">
  <img src="logo.webp" class="splash-logo" alt="Logo" onerror="this.style.display='none'">
  <div class="splash-text">HLTV</div>
</div>

<div id="app-container" style="display:none; width:100%; height:100%; display:flex; flex-direction:column;">
  
  <!-- КНОПКА МЕНЮ (мобильная) -->
  <button class="menu-btn" onclick="toggleMenu()" aria-label="Меню">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>

  <!-- ВЕРХНЕЕ МЕНЮ -->
  <header class="sidebar" id="sidebar">
    <button class="menu-close" onclick="toggleMenu()" aria-label="Закрыть">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="logo">
      <img src="logo.webp" alt="Logo" style="width:32px;height:32px;object-fit:contain;flex-shrink:0;" onerror="this.style.display='none'">
      HLTV
    </div>
    <div class="nav-links">
      <div class="nav-item active" id="nav-ranking" onclick="switchTab('ranking')">
        <svg viewBox="0 0 24 24" style="width:20px;height:20px;flex-shrink:0;"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm0 2v14h14V5H5zm2 4h10v2H7V9zm0 4h10v2H7v-2z"/></svg> Рейтинг
      </div>
      <div class="nav-item" id="nav-matches" onclick="switchTab('matches')">
        <svg viewBox="0 0 24 24" style="width:20px;height:20px;flex-shrink:0;"><path d="M7 2h10a2 2 0 0 1 2 2v2h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2V4a2 2 0 0 1 2-2zm0 2v2h10V4H7zm-4 6v10h18V10H3zm4 3h4v2H7v-2zm6 0h4v2h-4v-2z"/></svg> Матчи
      </div>
      <div class="nav-item" id="nav-news" onclick="switchTab('news')">
        <svg viewBox="0 0 24 24" style="width:20px;height:20px;flex-shrink:0;"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg> Новости
      </div>
      <div class="nav-item" id="nav-tournaments" onclick="switchTab('tournaments')">
        <svg viewBox="0 0 24 24" style="width:20px; height:20px; fill:currentColor; margin-right:8px;"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>Турниры
      </div>
      <div class="nav-item" id="nav-admin" onclick="switchTab('admin')">
        <svg viewBox="0 0 24 24" style="width:20px;height:20px;flex-shrink:0;"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg> Админка
      </div>
    </div>
  </header>

  <!-- ОСНОВНОЙ КОНТЕНТ -->
  <main class="main">
    
    <div id="screen-ranking" class="hidden">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h1 style="margin-bottom:0;">Рейтинг команд</h1>
        <button class="btn" style="width:auto; margin:0; padding:8px 16px; font-size:12px;" onclick="switchTab('register-team')">+ Заявить команду</button>
      </div>
      <div id="ranking-container"></div>
    </div>

    <div id="screen-register-team" class="hidden">
      <button class="back-btn" onclick="switchTab('ranking')">← Назад</button>
      <h1>Заявка на регистрацию</h1>
      <div id="register-team-content" style="background:var(--card); padding:20px; border-radius:16px; border:1px solid var(--border);"></div>
    </div>

    <div id="screen-tournaments" class="hidden">
      <div id="tournaments-container"></div>
    </div>

    <div id="screen-matches-list" class="hidden">
      <h1>Сыгранные матчи</h1>
      <div id="matches-container"></div>
    </div>
    
    <div id="screen-match-detail" class="hidden">
      
      <div id="match-detail-content"></div>
    </div>

    <div id="screen-team-detail" class="hidden">
      <button class="back-btn" onclick="switchTab('ranking')">← Назад</button>
      <div id="team-detail-content"></div>
    </div>

    <div id="screen-news" class="hidden">
      <h1>Новости / Замены</h1>
      <div id="news-content" style="background:var(--card); padding:20px; border-radius:16px; border:1px solid var(--border);"></div>
    </div>

    <div id="screen-admin-login" class="hidden">
      <h1>Вход в админку</h1>
      <div class="form-group">
        <label>Введите пароль</label>
        <input type="password" id="admin-pass" class="form-control" placeholder="••••••">
      </div>
      <button class="btn" onclick="loginAdmin()">Войти</button>
      <p id="admin-err" style="color:var(--lose); margin-top:10px; font-size:14px;"></p>
    </div>

    <div id="screen-admin-panel" class="hidden">
      <h1>Админ-панель</h1>
      <div style="display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;">
        <button class="btn btn-outline" style="width:auto; flex:1;" onclick="showAdminTab('teams')">Все команды</button>
        <button class="btn btn-outline" style="width:auto; flex:1;" onclick="showAdminTab('requests')">Заявки</button>
        <button class="btn btn-outline" style="width:auto; flex:1;" onclick="showAdminTab('matches')">+ Матч</button>
        <button class="btn btn-outline" style="width:auto; flex:1;" onclick="showAdminTab('tournaments')">+ Турнир</button>
      </div>
      <div id="admin-form-container" style="background:var(--card); padding:20px; border-radius:12px; border:1px solid var(--border);"></div>
    </div>

  </main>
</div>

<script src="data.js?v=2000"></script>
<script src="app_v6.js?v=2005"></script>
</body>
</html>
